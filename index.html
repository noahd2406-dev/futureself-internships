<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FutureSelf — Internships</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Fraunces:wght@600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #F0F2F4;
      --surface: #FFFFFF;
      --border: #D5DAE0;
      --text-primary: #2C3E50;
      --text-secondary: #5D6D7E;
      --accent: #2C3E50;
      --accent-light: #E8ECF0;
      --accent-hover: #1A252F;
      --tag-bg: #EAEef1;
      --shadow-hover: 0 6px 28px rgba(44,62,80,0.15);
      --radius: 14px;
      --radius-sm: 8px;
    }
    body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text-primary); min-height: 100vh; }

    /* Header */
    .header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 20px 40px; display: flex; align-items: center; gap: 16px; }
    .header-logo { font-family: 'Fraunces', serif; font-size: 22px; color: var(--accent); letter-spacing: -0.5px; }
    .header-divider { width: 1px; height: 24px; background: var(--border); }
    .header-tagline { font-size: 13px; color: var(--text-secondary); font-style: italic; }

    /* Container */
    .container { max-width: 1080px; margin: 0 auto; padding: 40px 24px 80px; }
    .page-title { font-family: 'Fraunces', serif; font-size: 36px; font-weight: 700; margin-bottom: 6px; letter-spacing: -0.8px; }
    .page-subtitle { font-size: 15px; color: var(--text-secondary); margin-bottom: 32px; }

    /* Search */
    .search-row { display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
    .search-input-wrap { position: relative; flex: 1; min-width: 220px; }
    .search-icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--text-secondary); pointer-events: none; }
    .location-input-wrap { position: relative; min-width: 180px; }
    .loc-icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--text-secondary); pointer-events: none; }
    input[type="text"] {
      width: 100%; padding: 12px 16px 12px 40px; border: 1.5px solid var(--border);
      border-radius: var(--radius-sm); font-family: inherit; font-size: 14px;
      background: var(--surface); color: var(--text-primary); transition: border-color 0.2s; outline: none;
    }
    input[type="text"]:focus { border-color: var(--accent); }
    input[type="text"]::placeholder { color: #ADADAD; }
    .btn-search {
      padding: 12px 24px; background: var(--accent); color: #fff; border: none;
      border-radius: var(--radius-sm); font-family: inherit; font-size: 14px;
      font-weight: 600; cursor: pointer; transition: background 0.2s; white-space: nowrap;
    }
    .btn-search:hover { background: var(--accent-hover); }

    /* Filters */
    .filters-wrap { display: flex; flex-direction: column; gap: 10px; margin-bottom: 28px; }
    .filter-group { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .filter-group-label { font-size: 11px; font-weight: 600; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.8px; width: 60px; flex-shrink: 0; }
    .filter-chip {
      padding: 6px 14px; border-radius: 999px; border: 1.5px solid var(--border);
      background: var(--surface); font-family: inherit; font-size: 13px;
      color: var(--text-secondary); cursor: pointer; transition: all 0.15s; font-weight: 500;
    }
    .filter-chip:hover { border-color: var(--accent); color: var(--accent); }
    .filter-chip.active { background: var(--accent); border-color: var(--accent); color: #fff; }

    /* Results */
    .results-meta { display: flex; align-items: center; margin-bottom: 18px; }
    .results-count { font-size: 13px; color: var(--text-secondary); }
    .results-count strong { color: var(--text-primary); }

    /* Cards */
    .jobs-grid { display: flex; flex-direction: column; gap: 14px; }
    .job-card {
      background: var(--surface); border: 1.5px solid var(--border); border-radius: var(--radius);
      padding: 22px 24px; display: flex; gap: 18px; align-items: flex-start;
      transition: box-shadow 0.2s, border-color 0.2s, transform 0.15s;
      animation: fadeUp 0.3s ease both;
    }
    .job-card:hover { box-shadow: var(--shadow-hover); border-color: #b0bec5; transform: translateY(-2px); }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
    .job-logo {
      width: 48px; height: 48px; border-radius: 10px; background: var(--tag-bg);
      border: 1px solid var(--border); display: flex; align-items: center; justify-content: center;
      font-family: 'Fraunces', serif; font-size: 20px; font-weight: 700;
      color: var(--accent); flex-shrink: 0; overflow: hidden;
    }
    .job-body { flex: 1; min-width: 0; }
    .job-title { font-size: 16px; font-weight: 600; color: var(--text-primary); margin-bottom: 3px; line-height: 1.3; }
    .job-company { font-size: 14px; color: var(--text-secondary); margin-bottom: 10px; }
    .job-tags { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
    .tag { padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 500; background: var(--tag-bg); color: var(--text-secondary); }
    .tag.remote { background: var(--accent-light); color: var(--accent); }
    .tag.new { background: #FFF3E0; color: #B85C00; }
    .job-desc { font-size: 13.5px; color: var(--text-secondary); line-height: 1.6; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .job-actions { display: flex; flex-direction: column; align-items: flex-end; gap: 10px; flex-shrink: 0; }
    .job-posted { font-size: 12px; color: #ADADAD; white-space: nowrap; }
    .btn-apply {
      padding: 9px 20px; background: var(--accent); color: #fff; border: none;
      border-radius: var(--radius-sm); font-family: inherit; font-size: 13px;
      font-weight: 600; cursor: pointer; transition: background 0.2s;
      text-decoration: none; display: inline-block; white-space: nowrap;
    }
    .btn-apply:hover { background: var(--accent-hover); }

    /* States */
    .loading-state { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 60px 20px; gap: 14px; }
    .spinner { width: 36px; height: 36px; border: 3px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-text { font-size: 14px; color: var(--text-secondary); }
    .empty-state { text-align: center; padding: 60px 20px; color: var(--text-secondary); }
    .empty-state svg { margin-bottom: 12px; opacity: 0.4; }
    .empty-state p { font-size: 15px; }
    .empty-state small { font-size: 13px; margin-top: 4px; display: block; }

    /* Pagination */
    .pagination { display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 36px; flex-wrap: wrap; }
    .btn-page {
      padding: 8px 16px; border: 1.5px solid var(--border); border-radius: var(--radius-sm);
      background: var(--surface); font-family: inherit; font-size: 13px;
      font-weight: 500; color: var(--text-secondary); cursor: pointer; transition: all 0.15s;
    }
    .btn-page:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
    .btn-page:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-page.active { background: var(--accent); border-color: var(--accent); color: #fff; }

    @media (max-width: 600px) {
      .header { padding: 20px; }
      .container { padding: 24px 16px 60px; }
      .page-title { font-size: 28px; }
      .job-card { flex-direction: column; gap: 12px; }
      .job-actions { flex-direction: row; align-items: center; width: 100%; justify-content: space-between; }
    }
  </style>
</head>
<body>

<header class="header">
  <div class="header-logo">FutureSelf</div>
  <div class="header-divider"></div>
  <div class="header-tagline">Set yourself up for success.</div>
</header>

<div class="container">

  <h1 class="page-title">Find Your Internship</h1>
  <p class="page-subtitle">Explore live opportunities matched to where you're headed.</p>

  <div class="search-row">
    <div class="search-input-wrap">
      <svg class="search-icon" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
      <input type="text" id="keywordInput" placeholder="Role, company, or skill…" />
    </div>
    <div class="location-input-wrap">
      <svg class="loc-icon" width="15" height="15" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/>
      </svg>
      <input type="text" id="locationInput" placeholder="City or Remote" />
    </div>
    <button class="btn-search" onclick="runSearch()">Search</button>
  </div>

  <div class="filters-wrap">
    <div class="filter-group">
      <div class="filter-group-label">Industry</div>
      <button class="filter-chip" data-field="industry" data-value="tech" onclick="toggleChip(this)">Tech</button>
      <button class="filter-chip" data-field="industry" data-value="finance" onclick="toggleChip(this)">Finance</button>
      <button class="filter-chip" data-field="industry" data-value="healthcare" onclick="toggleChip(this)">Healthcare</button>
      <button class="filter-chip" data-field="industry" data-value="realestate" onclick="toggleChip(this)">Real Estate</button>
      <button class="filter-chip" data-field="industry" data-value="marketing" onclick="toggleChip(this)">Marketing</button>
      <button class="filter-chip" data-field="industry" data-value="media" onclick="toggleChip(this)">Media</button>
      <button class="filter-chip" data-field="industry" data-value="legal" onclick="toggleChip(this)">Legal</button>
      <button class="filter-chip" data-field="industry" data-value="engineering" onclick="toggleChip(this)">Engineering</button>
    </div>
    <div class="filter-group">
      <div class="filter-group-label">Type</div>
      <button class="filter-chip" data-field="type" data-value="remote" onclick="toggleChip(this)">Remote Only</button>
      <button class="filter-chip" data-field="type" data-value="paid" onclick="toggleChip(this)">Paid</button>
    </div>
  </div>

  <div class="results-meta" id="resultsMeta" style="display:none">
    <div class="results-count" id="resultsCount"></div>
  </div>

  <div id="jobsContainer">
    <div class="loading-state">
      <div class="spinner"></div>
      <div class="loading-text">Loading internships…</div>
    </div>
  </div>

  <div class="pagination" id="pagination" style="display:none"></div>

</div>

<script>
  // ─────────────────────────────────────────────────
  //  Active Jobs DB via Cloudflare Worker proxy
  //  Worker handles CORS + passes RapidAPI key server-side
  // ─────────────────────────────────────────────────
  const WORKER_URL = 'https://apibeast.noahd2406.workers.dev';
  const PER_PAGE = 10;

  let currentPage  = 1;
  let totalResults = 0;
  let totalPages   = 1;
  let activeFilters = { industry: new Set(), type: new Set() };
  let allJobs = [];
  let displayedJobs = []; // cache all results for client-side pagination

  // Filter chip toggle
  function toggleChip(el) {
    const field = el.dataset.field;
    const value = el.dataset.value;
    if (el.classList.contains('active')) {
      el.classList.remove('active');
      activeFilters[field].delete(value);
    } else {
      el.classList.add('active');
      activeFilters[field].add(value);
    }
    applyFiltersAndRender();
  }

  // Build the title_filter string
  function buildTitleFilter(keyword) {
    return keyword ? keyword.trim() : '';
  }

  // Industry keyword maps
  const INDUSTRY_KEYWORDS = {
    tech:        ['software','engineer','developer','data','IT','cyber','cloud','machine learning','AI','product','UX','web','frontend','backend','devops','analytics','computer'],
    finance:     ['finance','financial','accounting','investment','banking','equity','hedge','capital','wealth','trading','audit','tax','CPA','CFO','economics','actuarial'],
    healthcare:  ['health','medical','clinical','hospital','nursing','pharma','biotech','lab','research','patient','doctor','physician','therapist','dental','public health'],
    realestate:  ['real estate','property','leasing','broker','REIT','mortgage','construction','architecture','land','urban','housing'],
    marketing:   ['marketing','brand','social media','content','SEO','growth','communications','PR','advertising','copywriting','creative','campaign'],
    media:       ['media','journalism','film','video','photo','design','graphic','animation','entertainment','publishing','podcast','news','broadcast'],
    legal:       ['legal','law','attorney','paralegal','compliance','regulatory','policy','contract','litigation','counsel'],
    engineering: ['mechanical','electrical','civil','chemical','aerospace','industrial','manufacturing','structural','environmental','materials']
  };

  // Apply client-side filters to allJobs and re-render
  function applyFiltersAndRender() {
    const industries = activeFilters.industry;
    const types      = activeFilters.type;

    displayedJobs = allJobs.filter(job => {
      const text = ((job.job_title || '') + ' ' + (job.job_description || '') + ' ' + (job.employer_name || '')).toLowerCase();

      // Industry filter (OR logic — show job if it matches ANY selected industry)
      if (industries.size > 0) {
        const matchesIndustry = [...industries].some(ind =>
          INDUSTRY_KEYWORDS[ind] && INDUSTRY_KEYWORDS[ind].some(kw => text.includes(kw.toLowerCase()))
        );
        if (!matchesIndustry) return false;
      }

      // Type filters
      if (types.has('remote') && !job.job_is_remote) return false;
      if (types.has('paid') && !(job.job_min_salary || job.job_max_salary)) return false;

      return true;
    });

    totalResults = displayedJobs.length;
    totalPages   = Math.max(1, Math.ceil(totalResults / PER_PAGE));
    renderPage(1);
  }

  // Kick off a search
  function runSearch(page = 1) {
    currentPage = page;
    if (page === 1) {
      const keyword  = document.getElementById('keywordInput').value.trim();
      const location = document.getElementById('locationInput').value.trim();
      fetchJobs(keyword, location);
    } else {
      renderPage(page);
    }
  }

  // Fetch live data from Active Jobs DB
  async function fetchJobs(keyword, location) {
    showLoading();

    const titleFilter    = buildTitleFilter(keyword);
    let   locationFilter = location || 'United States';
    if (activeFilters.type && activeFilters.type.has('remote')) locationFilter = 'Remote';

    const TOTAL_TARGET = 50;
    const BATCH_SIZE   = 5;  // requests per batch
    const PER_REQUEST  = 10;  // results per request
    allJobs = [];
    const seen = new Set();

    try {
      for (let batchStart = 0; batchStart < TOTAL_TARGET; batchStart += BATCH_SIZE * PER_REQUEST) {
        const offsets = [];
        for (let i = 0; i < BATCH_SIZE; i++) {
          offsets.push(batchStart + i * PER_REQUEST);
        }

        // Fetch batch sequentially with a small delay to avoid rate limiting
        const responses = [];
        for (const offset of offsets) {
          const params = new URLSearchParams({
            query:       (titleFilter ? titleFilter + ' ' : '') + 'internship',
            location:    locationFilter,
            page:        Math.floor(offset / 10) + 1,
            num_pages:   1,
            date_posted: 'all',
            employment_types: 'INTERN'
          });
          if (activeFilters.type && activeFilters.type.has('remote')) params.append('remote_jobs_only', 'true');

          const result = await fetch(`${WORKER_URL}?${params}`)
            .then(r => r.ok ? r.json() : { data: [] })
            .catch(() => ({ data: [] }));
          responses.push(result);

          await new Promise(resolve => setTimeout(resolve, 200));
        }

        const batch = responses.flatMap(r => Array.isArray(r) ? r : (r.data || [])).filter(job => {
          if (!job || !job.job_id) return false;
          if (seen.has(job.job_id)) return false;
          seen.add(job.job_id);
          return true;
        });

        allJobs = allJobs.concat(batch);

        // Update UI progressively as batches come in
        totalResults = allJobs.length;
        totalPages   = Math.max(1, Math.ceil(totalResults / PER_PAGE));
        if (batchStart === 0) { displayedJobs = allJobs; renderPage(1); }
        else {
          document.getElementById('resultsCount').innerHTML =
            `<strong>${totalResults.toLocaleString()}</strong> internships found &mdash; loading more…`;
        }

        // Stop early if a batch returned fewer results than expected (end of data)
        if (batch.length < BATCH_SIZE * PER_REQUEST * 0.5) break;
      }

      // Final render with full count
      displayedJobs = allJobs;
      totalResults = allJobs.length;
      totalPages   = Math.max(1, Math.ceil(totalResults / PER_PAGE));
      document.getElementById('resultsCount').innerHTML =
        `<strong>${totalResults.toLocaleString()}</strong> internships found &mdash; page ${currentPage} of ${totalPages}`;

    } catch (err) {
      showError(err.message);
    }
  }

  // Slice allJobs for the requested page and render cards
  function renderPage(page) {
    currentPage = page;
    const container = document.getElementById('jobsContainer');
    const meta      = document.getElementById('resultsMeta');
    const countEl   = document.getElementById('resultsCount');

    const start = (page - 1) * PER_PAGE;
    const source = (activeFilters.industry.size > 0 || activeFilters.type.size > 0) ? displayedJobs : allJobs;
    const jobs  = source.slice(start, start + PER_PAGE);

    if (jobs.length === 0) {
      container.innerHTML = `
        <div class="empty-state">
          <svg width="40" height="40" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.2">
            <circle cx="12" cy="12" r="10"/><line x1="8" y1="12" x2="16" y2="12"/>
          </svg>
          <p>No internships found for that search.</p>
          <small>Try different keywords or location.</small>
        </div>`;
      meta.style.display = 'none';
      document.getElementById('pagination').style.display = 'none';
      return;
    }

    meta.style.display = 'flex';
    const filterLabel = (activeFilters.industry.size > 0 || activeFilters.type.size > 0) ? ' (filtered)' : '';
    countEl.innerHTML  = `<strong>${source.length.toLocaleString()}</strong> internships found${filterLabel} &mdash; page ${page} of ${totalPages}`;

    container.innerHTML = '';
    const grid = document.createElement('div');
    grid.className = 'jobs-grid';
    jobs.forEach((job, i) => grid.appendChild(buildCard(job, i)));
    container.appendChild(grid);
    renderPagination(page);
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  // Build a single job card from Internships API fields
  function buildCard(job, delay) {
    const card = document.createElement('div');
    card.className = 'job-card';
    card.style.animationDelay = `${delay * 40}ms`;

    const title    = job.job_title || 'Internship';
    const company  = job.employer_name || 'Unknown Company';
    const city     = job.job_city || '';
    const state    = job.job_state || '';
    const country  = job.job_country || '';
    const location = [city, state, country].filter(Boolean).join(', ') || 'Location not listed';

    const applyUrl = job.job_apply_link || '#';
    const desc     = (job.job_description || 'No description available.')
                       .replace(/<[^>]*>/g, '').slice(0, 200) + '…';

    const dateStr  = job.job_posted_at_datetime_utc || null;
    const daysAgo  = dateStr ? Math.floor((Date.now() - new Date(dateStr)) / 86400000) : null;
    const isNew    = daysAgo !== null && daysAgo <= 3;
    const isRemote = job.job_is_remote === true || location.toLowerCase().includes('remote');

    const logoHtml = job.employer_logo
      ? `<img src="${job.employer_logo}" alt="${esc(company)}" style="width:100%;height:100%;object-fit:contain;border-radius:10px;" onerror="this.parentElement.textContent='${esc(company[0].toUpperCase())}'">`
      : esc(company[0].toUpperCase());

    card.innerHTML = `
      <div class="job-logo">${logoHtml}</div>
      <div class="job-body">
        <div class="job-header">
          <div class="job-title">${esc(title)}</div>
          <div class="job-posted">${daysAgo === 0 ? 'Today' : daysAgo != null ? `${daysAgo}d ago` : ''}</div>
        </div>
        <div class="job-company">${esc(company)}<span>·</span>${esc(location)}</div>
        <div class="job-tags">
          ${isRemote ? '<span class="tag remote">Remote</span>' : ''}
          ${isNew    ? '<span class="tag new">New</span>'       : ''}
        </div>
        <div class="job-footer">
          <div class="job-desc">${esc(desc)}</div>
          <a class="btn-apply" href="${applyUrl}" target="_blank" rel="noopener">Apply →</a>
        </div>
      </div>`;
    return card;
  }

  // Pagination controls
  function renderPagination(current) {
    const pg = document.getElementById('pagination');
    if (totalPages <= 1) { pg.style.display = 'none'; return; }
    pg.style.display = 'flex';
    pg.innerHTML = '';

    const prev = Object.assign(document.createElement('button'), { className:'btn-page', textContent:'← Prev', disabled: current === 1 });
    prev.onclick = () => runSearch(current - 1);
    pg.appendChild(prev);

    let start = Math.max(1, current - 2), end = Math.min(totalPages, start + 4);
    if (end - start < 4) start = Math.max(1, end - 4);
    for (let p = start; p <= end; p++) {
      const btn = Object.assign(document.createElement('button'), { className: 'btn-page' + (p===current?' active':''), textContent: p });
      const pp = p; btn.onclick = () => runSearch(pp);
      pg.appendChild(btn);
    }

    const next = Object.assign(document.createElement('button'), { className:'btn-page', textContent:'Next →', disabled: current === totalPages });
    next.onclick = () => runSearch(current + 1);
    pg.appendChild(next);
  }

  function showLoading() {
    document.getElementById('jobsContainer').innerHTML = `<div class="loading-state"><div class="spinner"></div><div class="loading-text">Searching internships…</div></div>`;
    document.getElementById('resultsMeta').style.display = 'none';
    document.getElementById('pagination').style.display  = 'none';
  }

  function showError(msg) {
    document.getElementById('jobsContainer').innerHTML = `
      <div class="empty-state">
        <svg width="40" height="40" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.2">
          <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
        </svg>
        <p>Something went wrong.</p>
        <small>${esc(msg)}</small>
      </div>`;
  }

  function esc(s) {
    return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  // Enter key support
  ['keywordInput','locationInput'].forEach(id =>
    document.getElementById(id).addEventListener('keydown', e => { if (e.key==='Enter') runSearch(); })
  );

  // Auto-load on page open
  window.addEventListener('DOMContentLoaded', () => runSearch());
</script>
</body>
</html>
