<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FutureSelf — Internships</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Fraunces:wght@600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #F0F2F4;
      --surface: #FFFFFF;
      --border: #D5DAE0;
      --text-primary: #2C3E50;
      --text-secondary: #5D6D7E;
      --accent: #2C3E50;
      --accent-light: #E8ECF0;
      --accent-hover: #1A252F;
      --tag-bg: #EAEef1;
      --shadow-hover: 0 6px 28px rgba(44,62,80,0.15);
      --radius: 14px;
      --radius-sm: 8px;
    }
    body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text-primary); min-height: 100vh; }

    .header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 18px 40px; display: flex; align-items: center; gap: 16px; }
    .header-logo { font-family: 'Fraunces', serif; font-size: 22px; color: var(--accent); letter-spacing: -0.5px; }
    .header-divider { width: 1px; height: 24px; background: var(--border); }
    .header-tagline { font-size: 13px; color: var(--text-secondary); font-style: italic; }

    .container { max-width: 1080px; margin: 0 auto; padding: 40px 24px 80px; }
    .page-title { font-family: 'Fraunces', serif; font-size: 36px; font-weight: 700; margin-bottom: 6px; letter-spacing: -0.8px; }
    .page-subtitle { font-size: 15px; color: var(--text-secondary); margin-bottom: 32px; }

    .search-row { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
    .search-input-wrap { position: relative; flex: 1; min-width: 220px; }
    .search-icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--text-secondary); pointer-events: none; }
    .location-input-wrap { position: relative; min-width: 180px; }
    .loc-icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--text-secondary); pointer-events: none; }
    input[type="text"] {
      width: 100%; padding: 12px 16px 12px 40px; border: 1.5px solid var(--border);
      border-radius: var(--radius-sm); font-family: inherit; font-size: 14px;
      background: var(--surface); color: var(--text-primary); transition: border-color 0.2s; outline: none;
    }
    input[type="text"]:focus { border-color: var(--accent); }
    input[type="text"]::placeholder { color: #ADADAD; }
    .btn-search {
      padding: 12px 24px; background: var(--accent); color: #fff; border: none;
      border-radius: var(--radius-sm); font-family: inherit; font-size: 14px;
      font-weight: 600; cursor: pointer; transition: background 0.2s; white-space: nowrap;
    }
    .btn-search:hover { background: var(--accent-hover); }

    .filters-section { margin-bottom: 32px; display: flex; flex-direction: column; gap: 16px; }

    .filter-block {
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      padding: 18px 20px;
    }
    .filter-block-header {
      display: flex;
      align-items: baseline;
      gap: 10px;
      margin-bottom: 14px;
    }
    .filter-block-title {
      font-family: 'Fraunces', serif;
      font-size: 16px;
      font-weight: 700;
      color: var(--text-primary);
      letter-spacing: -0.3px;
    }
    .filter-block-hint {
      font-size: 12px;
      color: #ADADAD;
      font-weight: 400;
    }
    .filter-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }
    .filter-chip {
      padding: 10px 14px;
      border-radius: var(--radius-sm);
      border: 1.5px solid var(--border);
      background: var(--bg);
      font-family: inherit;
      font-size: 13px;
      color: var(--text-secondary);
      cursor: pointer;
      transition: all 0.15s;
      font-weight: 500;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .filter-chip:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-light); }
    .filter-chip.active { background: var(--accent); border-color: var(--accent); color: #fff; }

    .results-meta { display: flex; align-items: center; margin-bottom: 18px; }
    .results-count { font-size: 13px; color: var(--text-secondary); }
    .results-count strong { color: var(--text-primary); }

    .jobs-grid { display: flex; flex-direction: column; gap: 14px; }
    .job-card {
      background: var(--surface); border: 1.5px solid var(--border); border-radius: var(--radius);
      padding: 22px 24px; display: flex; gap: 18px; align-items: flex-start;
      transition: box-shadow 0.2s, border-color 0.2s, transform 0.15s;
      animation: fadeUp 0.3s ease both;
    }
    .job-card:hover { box-shadow: var(--shadow-hover); border-color: #b0bec5; transform: translateY(-2px); }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
    .job-logo {
      width: 48px; height: 48px; border-radius: 10px; background: var(--tag-bg);
      border: 1px solid var(--border); display: flex; align-items: center; justify-content: center;
      font-family: 'Fraunces', serif; font-size: 20px; font-weight: 700;
      color: var(--accent); flex-shrink: 0;
    }
    .job-body { flex: 1; min-width: 0; }
    .job-title { font-size: 16px; font-weight: 600; color: var(--text-primary); margin-bottom: 3px; line-height: 1.3; }
    .job-company { font-size: 14px; color: var(--text-secondary); margin-bottom: 10px; }
    .job-tags { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
    .tag { padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 500; background: var(--tag-bg); color: var(--text-secondary); }
    .tag.remote { background: var(--accent-light); color: var(--accent); }
    .tag.new { background: #FFF3E0; color: #B85C00; }
    .tag.paid { background: #E8F5E9; color: #2E7D32; }
    .job-desc { font-size: 13.5px; color: var(--text-secondary); line-height: 1.6; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .job-actions { display: flex; flex-direction: column; align-items: flex-end; gap: 10px; flex-shrink: 0; }
    .job-posted { font-size: 12px; color: #ADADAD; white-space: nowrap; }
    .btn-apply {
      padding: 9px 20px; background: var(--accent); color: #fff; border: none;
      border-radius: var(--radius-sm); font-family: inherit; font-size: 13px;
      font-weight: 600; cursor: pointer; transition: background 0.2s;
      text-decoration: none; display: inline-block; white-space: nowrap;
    }
    .btn-apply:hover { background: var(--accent-hover); }

    .loading-state { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 60px 20px; gap: 14px; }
    .spinner { width: 36px; height: 36px; border: 3px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-text { font-size: 14px; color: var(--text-secondary); }
    .empty-state { text-align: center; padding: 60px 20px; color: var(--text-secondary); }
    .empty-state svg { margin-bottom: 12px; opacity: 0.4; }
    .empty-state p { font-size: 15px; }
    .empty-state small { font-size: 13px; margin-top: 4px; display: block; }

    .pagination { display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 36px; flex-wrap: wrap; }
    .btn-page {
      padding: 8px 16px; border: 1.5px solid var(--border); border-radius: var(--radius-sm);
      background: var(--surface); font-family: inherit; font-size: 13px;
      font-weight: 500; color: var(--text-secondary); cursor: pointer; transition: all 0.15s;
    }
    .btn-page:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
    .btn-page:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-page.active { background: var(--accent); border-color: var(--accent); color: #fff; }

    @media (max-width: 700px) {
      .header { padding: 16px 20px; }
      .container { padding: 24px 16px 60px; }
      .page-title { font-size: 28px; }
      .filter-grid { grid-template-columns: repeat(2, 1fr); }
      .job-card { flex-direction: column; gap: 12px; }
      .job-actions { flex-direction: row; align-items: center; width: 100%; justify-content: space-between; }
    }
  </style>
</head>
<body>

<header class="header">
  <div class="header-logo">FutureSelf</div>
  <div class="header-divider"></div>
  <div class="header-tagline">Set yourself up for success.</div>
</header>

<div class="container">
  <h1 class="page-title">Find Your Internship</h1>
  <p class="page-subtitle">Explore live opportunities matched to where you're headed.</p>

  <div class="search-row">
    <div class="search-input-wrap">
      <svg class="search-icon" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
      <input type="text" id="keywordInput" placeholder="Role, company, or skill…" />
    </div>
    <div class="location-input-wrap">
      <svg class="loc-icon" width="15" height="15" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/>
      </svg>
      <input type="text" id="locationInput" placeholder="City or Remote" />
    </div>
    <button class="btn-search" onclick="runSearch()">Search</button>
  </div>

  <div class="filters-section">

    <div class="filter-block">
      <div class="filter-block-header">
        <span class="filter-block-title">Industry</span>
        <span class="filter-block-hint">Select one or more</span>
      </div>
      <div class="filter-grid">
        <button class="filter-chip" data-category="industry" data-value="tech" onclick="toggleChip(this)">💻 Tech</button>
        <button class="filter-chip" data-category="industry" data-value="finance" onclick="toggleChip(this)">📈 Finance</button>
        <button class="filter-chip" data-category="industry" data-value="healthcare" onclick="toggleChip(this)">🏥 Healthcare</button>
        <button class="filter-chip" data-category="industry" data-value="marketing" onclick="toggleChip(this)">📣 Marketing</button>
        <button class="filter-chip" data-category="industry" data-value="engineering" onclick="toggleChip(this)">⚙️ Engineering</button>
        <button class="filter-chip" data-category="industry" data-value="media" onclick="toggleChip(this)">🎬 Media</button>
        <button class="filter-chip" data-category="industry" data-value="legal" onclick="toggleChip(this)">⚖️ Legal</button>
        <button class="filter-chip" data-category="industry" data-value="realestate" onclick="toggleChip(this)">🏠 Real Estate</button>
        <button class="filter-chip" data-category="industry" data-value="nonprofit" onclick="toggleChip(this)">🤝 Nonprofit</button>
        <button class="filter-chip" data-category="industry" data-value="education" onclick="toggleChip(this)">🎓 Education</button>
        <button class="filter-chip" data-category="industry" data-value="government" onclick="toggleChip(this)">🏛️ Government</button>
        <button class="filter-chip" data-category="industry" data-value="consulting" onclick="toggleChip(this)">💼 Consulting</button>
      </div>
    </div>

    <div class="filter-block">
      <div class="filter-block-header">
        <span class="filter-block-title">Type</span>
        <span class="filter-block-hint">Narrow your results</span>
      </div>
      <div class="filter-grid">
        <button class="filter-chip" data-category="type" data-value="remote" onclick="toggleChip(this)">🌐 Remote Only</button>
        <button class="filter-chip" data-category="type" data-value="paid" onclick="toggleChip(this)">💰 Paid</button>
        <button class="filter-chip" data-category="type" data-value="fulltime" onclick="toggleChip(this)">🕐 Full-time</button>
      </div>
    </div>

  </div>

  <div class="results-meta" id="resultsMeta" style="display:none">
    <div class="results-count" id="resultsCount"></div>
  </div>

  <div id="jobsContainer">
    <div class="loading-state">
      <div class="spinner"></div>
      <div class="loading-text">Loading internships…</div>
    </div>
  </div>

  <div class="pagination" id="pagination" style="display:none"></div>
</div>

<script>
  const WORKER_URL = 'https://apibeast.noahd2406.workers.dev';
  const PER_PAGE   = 10;

  let currentPage  = 1;
  let totalResults = 0;
  let totalPages   = 1;
  let allJobs      = [];
  let filteredJobs = [];

  // Which chips are active
  const activeFilters = { industry: new Set(), type: new Set() };

  const INDUSTRY_KEYWORDS = {
    tech:        ['software','engineer','developer','data','IT','cyber','cloud','AI','product','UX','web','frontend','backend','devops','analytics','computer','technology'],
    finance:     ['finance','financial','accounting','investment','banking','equity','capital','wealth','trading','audit','tax','economics','actuarial','fintech'],
    healthcare:  ['health','medical','clinical','hospital','nursing','pharma','biotech','lab','research','patient','dental','public health','biology','science'],
    marketing:   ['marketing','brand','social media','content','SEO','growth','communications','PR','advertising','copywriting','creative','campaign','digital'],
    engineering: ['mechanical','electrical','civil','chemical','aerospace','industrial','manufacturing','structural','environmental','materials','systems'],
    media:       ['media','journalism','film','video','photo','design','graphic','animation','entertainment','publishing','podcast','news','broadcast','art'],
    legal:       ['legal','law','attorney','paralegal','compliance','regulatory','policy','contract','litigation','counsel','justice'],
    realestate:  ['real estate','property','leasing','broker','mortgage','construction','architecture','housing','urban','planning'],
    nonprofit:   ['nonprofit','non-profit','ngo','charity','foundation','social impact','community','volunteer','advocacy','mission'],
    education:   ['education','teaching','tutoring','curriculum','school','university','academic','learning','instruction','training'],
    government:  ['government','federal','state','municipal','public sector','policy','administration','congress','agency','department'],
    consulting:  ['consulting','consultant','strategy','advisory','management consulting','operations','McKinsey','Deloitte','BCG','Accenture']
  };

  function toggleChip(el) {
    const cat = el.dataset.category;
    const val = el.dataset.value;
    if (el.classList.contains('active')) {
      el.classList.remove('active');
      activeFilters[cat].delete(val);
    } else {
      el.classList.add('active');
      activeFilters[cat].add(val);
    }
    applyFilters();
  }

  function applyFilters() {
    const industries = activeFilters.industry;
    const types      = activeFilters.type;

    filteredJobs = allJobs.filter(job => {
      const text = ((job.title || '') + ' ' + (job.description || '') + ' ' + (job.company?.display_name || '')).toLowerCase();

      if (industries.size > 0) {
        const match = [...industries].some(ind =>
          INDUSTRY_KEYWORDS[ind] && INDUSTRY_KEYWORDS[ind].some(kw => text.includes(kw.toLowerCase()))
        );
        if (!match) return false;
      }

      const loc = (job.location?.display_name || '').toLowerCase();
      const isRemote = loc.includes('remote') || (job.title || '').toLowerCase().includes('remote');
      if (types.has('remote') && !isRemote) return false;

      const hasSalary = job.salary_min || job.salary_max;
      if (types.has('paid') && !hasSalary) return false;


      const contractTime = (job.contract_time || '').toLowerCase();
      if (types.has('fulltime') && !contractTime.includes('full')) return false;

      return true;
    });

    totalResults = filteredJobs.length;
    totalPages   = Math.max(1, Math.ceil(totalResults / PER_PAGE));
    renderPage(1);
  }

  function buildQuery(keyword) {
    const parts = [keyword || 'internship'];
    return parts.join(' ');
  }

  function runSearch(page = 1) {
    currentPage = page;
    if (page === 1) {
      const keyword  = document.getElementById('keywordInput').value.trim();
      const location = document.getElementById('locationInput').value.trim();
      fetchJobs(keyword, location);
    } else {
      renderPage(page);
    }
  }

  async function fetchJobs(keyword, location) {
    showLoading();
    allJobs      = [];
    filteredJobs = [];

    // Fetch in batches of 10 pages, up to 50 pages total = up to 500 results
    const TOTAL_PAGES = 50;
    const BATCH       = 10;
    const seen        = new Set();
    allJobs           = [];

    try {
      for (let start = 1; start <= TOTAL_PAGES; start += BATCH) {
        const pages = Array.from({ length: BATCH }, (_, i) => start + i);
        const responses = await Promise.all(pages.map(p => {
          const params = new URLSearchParams({
            page: p,
            what: buildQuery(keyword),
          });
          if (location) params.append('where', location);
          return fetch(`${WORKER_URL}?${params}`)
            .then(r => r.ok ? r.json() : { results: [] })
            .catch(() => ({ results: [] }));
        }));

        const batch = responses.flatMap(d => d.results || []).filter(job => {
          if (!job.id || seen.has(job.id)) return false;
          seen.add(job.id);
          return true;
        });

        allJobs = allJobs.concat(batch);

        // Show first batch immediately
        if (start === 1) {
          applyFilters();
          document.getElementById('resultsMeta').style.display = 'flex';
        } else {
          document.getElementById('resultsCount').innerHTML =
            `<strong>${allJobs.length.toLocaleString()}</strong> internships loaded &mdash; loading more…`;
        }

        // Stop if we got fewer results than expected (end of data)
        if (batch.length < BATCH * 10 * 0.3) break;
      }

      // Final apply
      applyFilters();
    } catch (err) {
      showError(err.message);
    }
  }

  function renderPage(page) {
    currentPage = page;
    const container = document.getElementById('jobsContainer');
    const meta      = document.getElementById('resultsMeta');
    const countEl   = document.getElementById('resultsCount');

    const start = (page - 1) * PER_PAGE;
    const jobs  = filteredJobs.slice(start, start + PER_PAGE);

    if (jobs.length === 0) {
      container.innerHTML = `
        <div class="empty-state">
          <svg width="40" height="40" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.2">
            <circle cx="12" cy="12" r="10"/><line x1="8" y1="12" x2="16" y2="12"/>
          </svg>
          <p>No internships found.</p>
          <small>Try different keywords, location, or filters.</small>
        </div>`;
      meta.style.display = 'none';
      document.getElementById('pagination').style.display = 'none';
      return;
    }

    const filterActive = activeFilters.industry.size > 0 || activeFilters.type.size > 0;
    meta.style.display = 'flex';
    countEl.innerHTML  = `<strong>${totalResults.toLocaleString()}</strong> internships found${filterActive ? ' <span style="color:#ADADAD">(filtered)</span>' : ''} &mdash; page ${page} of ${totalPages}`;

    container.innerHTML = '';
    const grid = document.createElement('div');
    grid.className = 'jobs-grid';
    jobs.forEach((job, i) => grid.appendChild(buildCard(job, i)));
    container.appendChild(grid);
    renderPagination(page);
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function buildCard(job, delay) {
    const card = document.createElement('div');
    card.className = 'job-card';
    card.style.animationDelay = `${delay * 40}ms`;

    const company  = job.company?.display_name || 'Unknown Company';
    const location = job.location?.display_name || 'Location not listed';
    const applyUrl = job.redirect_url || '#';
    const desc     = (job.description || 'No description available.').replace(/<[^>]*>/g, '').slice(0, 200) + '…';
    const daysAgo  = job.created ? Math.floor((Date.now() - new Date(job.created)) / 86400000) : null;
    const isNew    = daysAgo !== null && daysAgo <= 3;
    const isRemote = location.toLowerCase().includes('remote') || (job.title || '').toLowerCase().includes('remote');
    const hasSalary = job.salary_min && job.salary_max;
    const salary   = hasSalary ? `$${Math.round(job.salary_min/1000)}k–$${Math.round(job.salary_max/1000)}k` : null;

    card.innerHTML = `
      <div class="job-logo">${esc(company[0].toUpperCase())}</div>
      <div class="job-body">
        <div class="job-title">${esc(job.title || 'Internship')}</div>
        <div class="job-company">${esc(company)} &middot; ${esc(location)}</div>
        <div class="job-tags">
          ${isRemote ? '<span class="tag remote">Remote</span>' : ''}
          ${isNew    ? '<span class="tag new">New</span>'       : ''}
          ${salary   ? `<span class="tag paid">${esc(salary)}</span>` : ''}
        </div>
        <div class="job-desc">${esc(desc)}</div>
      </div>
      <div class="job-actions">
        <span class="job-posted">${daysAgo === 0 ? 'Today' : daysAgo != null ? `${daysAgo}d ago` : ''}</span>
        <a class="btn-apply" href="${applyUrl}" target="_blank" rel="noopener">Apply &rarr;</a>
      </div>`;
    return card;
  }

  function renderPagination(current) {
    const pg = document.getElementById('pagination');
    if (totalPages <= 1) { pg.style.display = 'none'; return; }
    pg.style.display = 'flex';
    pg.innerHTML = '';

    const prev = Object.assign(document.createElement('button'), { className:'btn-page', textContent:'← Prev', disabled: current === 1 });
    prev.onclick = () => runSearch(current - 1);
    pg.appendChild(prev);

    let start = Math.max(1, current - 2), end = Math.min(totalPages, start + 4);
    if (end - start < 4) start = Math.max(1, end - 4);
    for (let p = start; p <= end; p++) {
      const btn = Object.assign(document.createElement('button'), { className: 'btn-page' + (p===current?' active':''), textContent: p });
      const pp = p; btn.onclick = () => runSearch(pp);
      pg.appendChild(btn);
    }

    const next = Object.assign(document.createElement('button'), { className:'btn-page', textContent:'Next →', disabled: current === totalPages });
    next.onclick = () => runSearch(current + 1);
    pg.appendChild(next);
  }

  function showLoading() {
    document.getElementById('jobsContainer').innerHTML = `<div class="loading-state"><div class="spinner"></div><div class="loading-text">Searching internships…</div></div>`;
    document.getElementById('resultsMeta').style.display = 'none';
    document.getElementById('pagination').style.display  = 'none';
  }

  function showError(msg) {
    document.getElementById('jobsContainer').innerHTML = `
      <div class="empty-state">
        <svg width="40" height="40" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.2">
          <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
        </svg>
        <p>Something went wrong.</p>
        <small>${esc(msg)}</small>
      </div>`;
  }

  function esc(s) {
    return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  ['keywordInput','locationInput'].forEach(id =>
    document.getElementById(id).addEventListener('keydown', e => { if (e.key==='Enter') runSearch(); })
  );

  window.addEventListener('DOMContentLoaded', () => runSearch());
</script>
</body>
</html>
